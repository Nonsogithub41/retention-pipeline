name: Retention pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  issues: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unzip the data
        run: unzip -o online_retail.zip

      - name: Run the retention pipeline
        run: python retention_pipeline.py --input online_retail.csv --outdir output

      - name: Show the summary
        run: cat output/summary.json

      - name: Open an alert issue if revenue at risk is high
        if: ${{ hashFiles('output/alert_issue.md') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "Retention alert - revenue at risk is high" --body-file output/alert_issue.md

      - name: Upload the outputs
        uses: actions/upload-artifact@v4
        with:
          name: retention-output
          path: output/
