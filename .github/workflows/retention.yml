name: Retention pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: write
  issues: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unzip the data
        run: unzip -o online_retail.zip

      - name: Run the retention pipeline
        run: python retention_pipeline.py --input online_retail.csv --outdir output

      - name: Generate the AI insight
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python generate_insight.py --outdir output

      - name: Show the summary
        run: cat output/summary.json

      - name: Publish the results to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/*.csv output/insight.md
          git diff --staged --quiet || git commit -m "Refresh retention outputs [skip ci]"
          git push

      - name: Open an alert issue if revenue at risk is high
        if: ${{ hashFiles('output/alert_issue.md') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { [ -f output/insight.md ] && cat output/insight.md && echo; cat output/alert_issue.md; } > issue_body.md
          gh issue create --title "Retention alert - revenue at risk is high" --body-file issue_body.md
